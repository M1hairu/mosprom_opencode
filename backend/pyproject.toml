[project]
name = "api"
version = "0.1.0"
description = "Бэкенд решения (пресет web-fullstack)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.20.1",
  "fastapi>=0.115",
  "psycopg[binary]>=3.3.6",
  "sqlalchemy>=2.1.6",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "httpx2>=2.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.alembic]
script_location = "%(here)s/migrations"

[[tool.alembic.post_write_hooks]]
name = "ruff_fix"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"
