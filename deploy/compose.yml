# Production on the team server (scripts/deploy.sh): caddy (HTTPS) → web (nginx: SPA, /api → api) → api → db.
# Only caddy publishes ports. Variables: POSTGRES_* from the server .env; GIT_SHA, SITE_ADDRESS,
# ACME_EMAIL from scripts/deploy.sh. The dev stack stays in ../docker-compose.yml (make demo).
name: lassard

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?нет в .env сервера}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нет в .env сервера}
      POSTGRES_DB: ${POSTGRES_DB:?нет в .env сервера}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 30s
      timeout: 3s
      start_period: 60s
      start_interval: 1s

  api:
    build:
      context: ..
      target: api
      args:
        GIT_SHA: ${GIT_SHA:?нет GIT_SHA — запускайте scripts/deploy.sh}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      EDITOR_PASSWORD: ${EDITOR_PASSWORD:-}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD:-}
      EXPERT_PASSWORD: ${EXPERT_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 3s
      start_period: 60s
      start_interval: 1s

  web:
    build:
      context: ..
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 60s
      start_interval: 1s

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    # GIT_SHA changes on every deploy, so compose recreates caddy and remounts ./caddy.
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?нет SITE_ADDRESS — домен сайта}
      ACME_EMAIL: ${ACME_EMAIL:?нет ACME_EMAIL — e-mail для Let's Encrypt}
      GIT_SHA: ${GIT_SHA:?нет GIT_SHA — запускайте scripts/deploy.sh}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    # A directory, not the file: the caddy image docs warn against a single-file mount.
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  db:
  caddy_data:
  caddy_config:
