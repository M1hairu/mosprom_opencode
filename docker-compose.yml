# make demo: db (PostgreSQL) → api (FastAPI; migrations on start) → web (nginx: SPA, /api → api).
# Passwords and ports come from .env (template: .env.example).
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?нет в .env — скопируйте строки из .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нет в .env — скопируйте строки из .env.example}
      POSTGRES_DB: ${POSTGRES_DB:?нет в .env — скопируйте строки из .env.example}
    ports:
      - "127.0.0.1:${DB_PORT:?нет в .env}:5432"
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 30s
      timeout: 3s
      start_period: 60s
      start_interval: 1s

  api:
    build:
      context: .
      target: api
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    # Only what the api reads; add a new variable here, not the whole .env.
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      EDITOR_PASSWORD: ${EDITOR_PASSWORD:-}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD:-}
      EXPERT_PASSWORD: ${EXPERT_PASSWORD:-}
      LEADS_WEBHOOK_URL: ${LEADS_WEBHOOK_URL:-}
    ports:
      - "127.0.0.1:${API_PORT:?нет в .env}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 3s
      start_period: 60s
      start_interval: 1s

  web:
    build:
      context: .
      target: web
    # All interfaces: a phone on the same network opens /guide.
    ports:
      - "${WEB_PORT:?нет в .env}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 60s
      start_interval: 1s

volumes:
  db:
